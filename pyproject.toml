[project]
name = "lemora"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ruchi-sehgal", email = "ruchi18sehgal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.8",
    "pydantic-ai-slim[groq]>=2.66.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
lemora = "lemora:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
